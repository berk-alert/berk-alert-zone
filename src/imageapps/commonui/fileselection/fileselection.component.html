<h1> {{ prompt }}</h1>
<div class="full-input-area">
    <input 
        type="file" 
        class="file-upload" 
        accept="image/jpeg" 
        (change)="uploadFile($event)"
    >
    <div class="preview-area">
        @if (shouldDisplay) {
            <div class="controls">
                <button type="button" (click)="rotateCounterClockwise()" class="control-button">Rotate &#8630;</button>
                <button type="button" (click)="rotateClockwise()" class="control-button">Rotate &#8631;</button>
                <button type="button" (click)="submit()" class="control-button">Submit</button>
            </div>
        }
        <canvas #processedStartingPoint></canvas>
    </div>
</div>
